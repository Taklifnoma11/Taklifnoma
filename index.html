<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taklif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* ===== Fon: mavzuli sahnalar + xira rasm ===== */
  .bg-scenes, .bg-photo { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  .scene {
    position: absolute; inset: 0; opacity: 0;
    animation: sceneFade 25s infinite;
    overflow: hidden;
  }
  .scene span.e { position: absolute; opacity: 0.35; user-select: none; }
  .scene .label {
    position: absolute; left: 0; right: 0; bottom: 6%;
    text-align: center; font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 22px; color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 8px rgba(0,0,0,0.25); opacity: 1;
  }
  @keyframes sceneFade {
    0%   { opacity: 0; }
    4%   { opacity: 1; }
    20%  { opacity: 1; }
    24%  { opacity: 0; }
    100% { opacity: 0; }
  }
  .bg-photo {
    background: url('photo.jpg') center 30% / cover no-repeat;
    opacity: 0.28;
    filter: blur(1.5px) saturate(0.85);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 95%);
            mask-image: radial-gradient(ellipse at center, #000 35%, transparent 95%);
  }
  .heart {
    position: fixed;
    top: -10%;
    font-size: 24px;
    opacity: 0.6;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .card-inner {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .card-banner {
    margin: -40px -30px 20px -30px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-banner svg { width: 100%; height: 100%; display: block; }

  .invite-card {
    background: linear-gradient(160deg, #fdf3ec 0%, #f7e2df 100%);
    border: 1px solid #c9a45c;
    border-radius: 4px;
    padding: 34px 22px;
    position: relative;
  }
  .invite-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid #c9a45c;
    border-radius: 2px;
    pointer-events: none;
  }
  .invite-label {
    font-family: 'Playfair Display', serif;
    letter-spacing: 5px;
    font-size: 13px;
    color: #b8863f;
    font-weight: 600;
  }
  .invite-name {
    font-family: 'Great Vibes', cursive;
    font-size: 64px;
    color: #7d1f3d;
    margin: 6px 0 10px;
    line-height: 1.1;
  }
  .invite-question {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #4a3b35;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 22px;
  }
  .invite-qrbox {
    background: white;
    display: inline-block;
    padding: 16px;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .invite-scan {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #4a3b35;
    font-size: 15px;
    margin-top: 22px;
  }
  .invite-signature {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    letter-spacing: 2px;
    color: #b8863f;
    font-size: 17px;
    margin-top: 6px;
  }
  h1 { color: #e0245e; font-size: 22px; margin-bottom: 10px; }
  p { color: #555; font-size: 16px; line-height: 1.5; }
  #qrcode { display: inline-block; margin: 20px auto; padding: 12px; background: white; border-radius: 16px; }
  .btns { display: flex; gap: 16px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-size: 18px;
    font-weight: 600;
    padding: 14px 32px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.95); }
  .yes-btn { background: #ff4d6d; color: white; box-shadow: 0 6px 16px rgba(255,77,109,0.4); }
  .no-btn { background: #e0e0e0; color: #555; transition: transform 0.15s ease, left 0.2s ease, top 0.2s ease; }
  .no-btn.roaming { position: fixed; z-index: 50; }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .choice {
    border: 3px solid transparent; border-radius: 18px; padding: 16px 8px 12px;
    cursor: pointer; color: #fff; font-weight: 700; font-size: 15px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    transition: transform 0.15s ease, border-color 0.15s ease;
    position: relative; overflow: hidden;
  }
  .choice:active { transform: scale(0.96); }
  .choice:last-child { grid-column: 1 / -1; }
  .choice .big { font-size: 44px; line-height: 1.1; display: block; margin-bottom: 4px; }
  .choice .mini { position: absolute; font-size: 20px; opacity: 0.35; }
  .back-link { display:inline-block; margin-top:18px; color:#e0245e; font-size:14px; cursor:pointer; text-decoration:underline; }
  .final { font-size: 60px; animation: pop 0.5s ease; }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .retry-msg { color: #ff4d6d; font-weight: 600; margin-top: 10px; min-height: 24px; }
  .small { font-size: 13px; color: #999; margin-top: 20px; }
  input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ffc2d1; font-size: 16px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>

<div class="bg-scenes" id="bgScenes"></div>
<div class="bg-photo"></div>

<div class="card" id="card"></div>

<script>
/* ==========================================================
   SOZLASH (CONFIG)
   GitHub Pages'ga joylashtirgandan keyin, saytingiz manzilini
   shu yerga yozing. Masalan:
   const BASE_URL = "https://foydalanuvchi-nomi.github.io/repo-nomi/";
   Bo'sh qoldirsangiz, sayt hozirgi manzilini o'zi aniqlaydi
   (lokal tekshirish uchun mos, lekin telefonlar orasida
   ishlashi uchun GitHub Pages manzilini yozish shart).
   ========================================================== */
const BASE_URL = "https://taklifnoma11.github.io/Taklifnoma/";

/* Statistikani masofadan saqlash uchun oddiy bepul hisoblagich
   (faqat "Yo'q" bosilgan sonini saqlaydi, hech kimga ko'rinmaydi,
   faqat siz ?admin=1 orqali ko'rasiz).
   Diqqat: kalit (COUNTER_KEY) ochiq bo'lgani uchun uni topganlar
   ham qiymatini ko'ra oladi, lekin kalit nomi taxmin qilib
   bo'lmaydigan darajada noyob qilingan. */
const COUNTER_KEY = "taklifnoma11-yoq-soni-x7k2m9-2026";

/* Telegram orqali xabar yuborish uchun (kim qanday javob berganini
   sizga to'g'ridan-to'g'ri Telegram'da ko'rsatadi).
   Diqqat: bu token sahifa manbasida ko'rinadi (client-side), shuning
   uchun uni faqat shu maqsad uchun ishlating va boshqa joyda
   ishlatmang. */
const TELEGRAM_BOT_TOKEN = "8947967987:AAHTEOuxv8H_JnV0t6fbXucJdokS4sQeclY";
const TELEGRAM_CHAT_ID = "8027087107";

function sendTelegram(text) {
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(text)}`;
  fetch(url).catch(() => {});
}


/* Fon sahnalari: bowling, kino, hayvonot bog'i, teatr, konki */
const SCENES = [
  { emoji: ['🎳','🎳','🏆'], text: 'Bowling night 🎳',     grad: 'linear-gradient(160deg,#ff9a9e,#fad0c4)' },
  { emoji: ['🎬','🍿','🎞️'], text: 'Movie night 🍿',       grad: 'linear-gradient(160deg,#a18cd1,#fbc2eb)' },
  { emoji: ['🦁','🐘','🦒','🐧'], text: 'Zoo night 🦁',     grad: 'linear-gradient(160deg,#84fab0,#8fd3f4)' },
  { emoji: ['🎭','🎟️','🌹'], text: 'Theatre night 🎭',     grad: 'linear-gradient(160deg,#f6d365,#fda085)' },
  { emoji: ['⛸️','❄️','⛄'], text: 'Ice-skating ⛸️',       grad: 'linear-gradient(160deg,#a1c4fd,#c2e9fb)' }
];
(function buildScenes() {
  const wrap = document.getElementById('bgScenes');
  SCENES.forEach((sc, i) => {
    const d = document.createElement('div');
    d.className = 'scene';
    d.style.background = sc.grad;
    d.style.animationDelay = (i * 5) + 's';
    for (let k = 0; k < 28; k++) {
      const e = document.createElement('span');
      e.className = 'e';
      e.textContent = sc.emoji[k % sc.emoji.length];
      e.style.left = (Math.random() * 92) + '%';
      e.style.top = (Math.random() * 90) + '%';
      e.style.fontSize = (22 + Math.random() * 34) + 'px';
      e.style.transform = 'rotate(' + (Math.random() * 40 - 20) + 'deg)';
      d.appendChild(e);
    }
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = sc.text;
    d.appendChild(l);
    wrap.appendChild(d);
  });
})();

const params = new URLSearchParams(window.location.search);
const isAsk = params.get('ask') === '1';
const isAdmin = params.get('admin') === '1';
const card = document.getElementById('card');

function buildLink(queryStr) {
  if (BASE_URL) {
    return BASE_URL.replace(/\/?$/, '') + '/' + queryStr;
  }
  return window.location.origin + window.location.pathname + queryStr;
}

let userName = '';

const cardBanner = `
  <div class="card-banner">
    <svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff7a9c"/>
          <stop offset="100%" stop-color="#ffb6c9"/>
        </linearGradient>
      </defs>
      <rect width="400" height="140" fill="url(#bgGrad)"/>
      <circle cx="60" cy="30" r="14" fill="#ffffff" opacity="0.25"/>
      <circle cx="340" cy="100" r="20" fill="#ffffff" opacity="0.2"/>
      <circle cx="320" cy="25" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M200 105 C170 75, 130 65, 130 40 C130 22, 150 12, 165 25 C175 33, 200 55, 200 55 C200 55, 225 33, 235 25 C250 12, 270 22, 270 40 C270 65, 230 75, 200 105 Z" fill="#ffffff"/>
      <circle cx="100" cy="60" r="5" fill="#ffffff" opacity="0.6"/>
      <circle cx="300" cy="55" r="6" fill="#ffffff" opacity="0.6"/>
      <circle cx="90" cy="100" r="4" fill="#ffffff" opacity="0.5"/>
    </svg>
  </div>
`;

function renderNameForm() {
  card.innerHTML = `
  <div class="card-inner">
    ${cardBanner}
    <div style="font-size:50px;">💌</div>
    <h1>Assalomu alaykum!</h1>
    <p>Avval ismingizni kiriting</p>
    <input id="nameInput" type="text" placeholder="Ismingiz...">
    <div class="btns">
      <button class="yes-btn" onclick="submitName()">Davom etish ➡️</button>
    </div>
  </div>
  `;
}

function submitName() {
  const val = document.getElementById('nameInput').value.trim();
  userName = val || 'Aziz do\'stim';
  renderQuestion();
}

function renderQuestion() {
  card.innerHTML = `
  <div class="card-inner">
    ${cardBanner}
    <div style="font-size:50px;">💌</div>
    <h1>${userName}, bitta savolim bor edi...</h1>
    <p id="question">Men bilan uchrashuvga chiqishga rozimisiz?</p>
    <div class="btns" id="btns">
      <button class="yes-btn" onclick="sayYes()">✅ Ha</button>
      <button class="no-btn" id="noBtn" onclick="sayNo()">❌ Yo'q</button>
    </div>
    <div class="retry-msg" id="retryMsg"></div>
  </div>
  `;
}

const noMessages = [
  "Yana bir marta urinib ko'ring 🥺",
  "Iltimos, yaxshilab o'ylang... 🙏",
  "Sizsiz bo'lmaydi, yana bir bor 😢",
  "Yurak sizni kutmoqda, yana urining 💔➡️❤️"
];
let noCount = 0;

function sayNo() {
  noCount++;
  const msg = document.getElementById('retryMsg');
  msg.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
  // Faqat sizga ko'rinishi uchun, hisobni fon rejimida serverga yuboramiz
  fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`).catch(() => {});
  sendTelegram(`❌ ${userName} "Yo'q" dedi (${noCount}-marta)`);
  moveNoButton();
}

function moveNoButton() {
  const btn = document.getElementById('noBtn');
  if (!btn) return;
  btn.classList.add('roaming');
  const w = btn.offsetWidth || 120;
  const h = btn.offsetHeight || 50;
  const maxLeft = window.innerWidth - w - 16;
  const maxTop = window.innerHeight - h - 16;
  const left = Math.max(16, Math.floor(Math.random() * maxLeft));
  const top = Math.max(16, Math.floor(Math.random() * maxTop));
  btn.style.left = left + 'px';
  btn.style.top = top + 'px';
}

function sayYes() {
  sendTelegram(`✅ ${userName} "Ha" dedi! 🎉`);
  renderMovieForm();
}

const ACTIVITIES = [
  { id: 'bowling', title: 'Bowling night', emoji: '🎳', minis: ['🏆','🎳'], grad: 'linear-gradient(160deg,#ff7a9c,#ffb199)' },
  { id: 'movie',   title: 'Movie night',   emoji: '🍿', minis: ['🎬','🎞️'], grad: 'linear-gradient(160deg,#8e7cc3,#e5a8e8)' },
  { id: 'zoo',     title: 'Zoo night',     emoji: '🦁', minis: ['🐘','🦒'], grad: 'linear-gradient(160deg,#43c59e,#7ec8e3)' },
  { id: 'theatre', title: 'Theatre night', emoji: '🎭', minis: ['🎟️','🌹'], grad: 'linear-gradient(160deg,#f2a83b,#f27d5b)' },
  { id: 'skating', title: 'Ice-skating',   emoji: '⛸️', minis: ['❄️','⛄'], grad: 'linear-gradient(160deg,#6a9cf5,#8fd3f4)' }
];
let chosenActivity = null;

function renderMovieForm() { renderActivityChoice(); }

function renderActivityChoice() {
  const cards = ACTIVITIES.map((a, i) => `
    <div class="choice" style="background:${a.grad}" onclick="chooseActivity(${i})">
      <span class="mini" style="left:8px; top:6px;">${a.minis[0]}</span>
      <span class="mini" style="right:8px; top:6px;">${a.minis[1]}</span>
      <span class="big">${a.emoji}</span>
      ${a.title}
    </div>`).join('');
  card.innerHTML = `
  <div class="card-inner">
    ${cardBanner}
    <div style="font-size:50px;">💖</div>
    <h1>Ajoyib, ${userName}!</h1>
    <p>Qayerga boramiz? Birini tanlang:</p>
    <div class="choice-grid">${cards}</div>
  </div>
  `;
}

function chooseActivity(i) {
  chosenActivity = ACTIVITIES[i];
  sendTelegram(`${chosenActivity.emoji} ${userName} tanladi: ${chosenActivity.title}`);
  renderDateForm();
}

function renderDateForm() {
  const a = chosenActivity;
  card.innerHTML = `
  <div class="card-inner">
    ${cardBanner}
    <div style="font-size:50px;">${a.emoji}</div>
    <h1>${a.title}</h1>
    <p>Qaysi kuni va soat nechada bo'lsin?</p>
    <input id="dateInput" type="datetime-local">
    <div class="retry-msg" id="dateMsg"></div>
    <div class="btns">
      <button class="yes-btn" onclick="submitDate()">Yuborish 🎉</button>
    </div>
    <span class="back-link" onclick="renderActivityChoice()">⬅️ Boshqasini tanlash</span>
  </div>
  `;
}

function submitDate() {
  const rawDate = document.getElementById('dateInput').value;
  if (!rawDate) {
    document.getElementById('dateMsg').textContent = "Iltimos, kun va vaqtni tanlang 🙏";
    return;
  }
  const d = new Date(rawDate);
  const dateText = d.toLocaleString('uz-UZ', { day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' });
  const a = chosenActivity;
  sendTelegram(`${a.emoji} ${userName} bilan reja:\nQayerga: ${a.title}\nQachon: ${dateText}`);
  renderFinal(a, dateText);
}

function renderFinal(a, dateText) {
  card.innerHTML = `
  <div class="card-inner">
    ${cardBanner}
    <div class="final">🎉${a.emoji}❤️</div>
    <h1>Rahmat, ${userName}!</h1>
    <p>${a.title} — ${dateText} da ko'rishguncha! 😍</p>
  </div>
  `;
  for (let i = 0; i < 30; i++) {
    setTimeout(() => spawnHeart(), i * 60);
  }
}

function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = ['❤️','💕','💖','💗'][Math.floor(Math.random()*4)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (16 + Math.random()*20) + 'px';
  h.style.animationDuration = (3 + Math.random()*3) + 's';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}
setInterval(spawnHeart, 700);

function renderHome() {
  const url = buildLink('?ask=1');
  card.innerHTML = `
  <div class="invite-card">
    <div class="invite-label">UCHRASHUV TAKLIFNOMASI</div>
    <div class="invite-question">Men bilan uchrashishga rozi<br>bo'lasizmi?</div>
    <div class="invite-qrbox"><div id="qrcode"></div></div>
    <div class="invite-scan">Skanerlab javob bering 💌</div>
  </div>
  `;
  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 180,
    height: 180,
    colorDark: "#7d1f3d",
    colorLight: "#ffffff"
  });
}

function renderAdmin() {
  card.innerHTML = `
  <div class="card-inner">
    <div style="font-size:50px;">🔒📊</div>
    <h1>Faqat siz uchun</h1>
    <p id="adminResult">Yuklanmoqda...</p>
    <div class="btns">
      <button class="yes-btn" onclick="loadCount()">🔄 Yangilash</button>
    </div>
    <p class="small"><a href="?">Bosh sahifaga qaytish</a></p>
  </div>
  `;
  loadCount();
}

function loadCount() {
  const el = document.getElementById('adminResult');
  el.textContent = "Yuklanmoqda...";
  fetch(`https://countapi.mileshilliard.com/api/v1/get/${COUNTER_KEY}`)
    .then(r => r.json())
    .then(data => {
      const count = data.value || 0;
      el.textContent = `"Yo'q" tugmasi jami ${count} marta bosilgan`;
    })
    .catch(() => { el.textContent = "Hozircha ma'lumot yo'q (hali hech kim 'Yo'q' bosmagan)"; });
}

if (isAdmin) {
  renderAdmin();
} else if (isAsk) {
  renderNameForm();
} else {
  renderHome();
}
</script>

</body>
</html>
